<!doctype html><meta charset="utf-8"><title>Teste do painel</title><pre id="out" style="margin-left:550px">aguardando...</pre>
<script>
window.stored={apiKey:'k',targetLanguage:'en',myLanguage:'pt-BR'};window.runtimeMessages=[];
window.chrome={storage:{local:{get:async()=>({...stored}),set:async v=>Object.assign(stored,v)}},runtime:{sendMessage:async m=>{runtimeMessages.push(m);return{ok:true}},onMessage:{addListener:f=>window.remoteEvent=f}}};
window.sockets=[];window.WebSocket=class{constructor(){this.sent=[];sockets.push(this);setTimeout(()=>this.onopen(),0)}send(m){this.sent.push(JSON.parse(m))}close(){this.closed=true}};
const attach=Element.prototype.attachShadow;Element.prototype.attachShadow=function(options){return window.panelRoot=attach.call(this,options)};
</script>
<script src="../src/gemini-translate.js"></script><script src="../src/session-manager.js"></script><script src="../src/status.js"></script><script src="../src/panel-dom.js"></script><script src="../src/content.js"></script>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
window.addEventListener('load',async()=>{
 const r=window.results={};try{
  await wait(50);const q=s=>panelRoot.querySelector(s);
  q('.remote-toggle').click();await wait(50);
  r.opensReceiverWindow=runtimeMessages.some(m=>m.type==='remote-open');
  r.promptsForTab=/janela de captura/.test(q('.remote-status').textContent);
  remoteEvent({type:'remote-window-event',event:{type:'remote-ready'}});await wait(50);
  const remote=sockets[0];remote.onmessage({data:JSON.stringify({setupComplete:{}})});
  remoteEvent({type:'remote-window-event',event:{type:'remote-state',tracks:1,hearing:true,peak:.2,sentFrames:10,contextState:'running',captureMode:'tab'}});
  r.showsTabCapture=/Fonte: áudio da aba/.test(q('.remote-diag').textContent);
  remote.onmessage({data:JSON.stringify({serverContent:{inputTranscription:{text:'Hello'},outputTranscription:{text:'Olá'}}})});
  r.showsTranscripts=q('.remote-input').textContent==='Hello'&&q('.remote-output').textContent==='Olá';
  q('.mode-voice').click();await wait(20);r.voicePlaysOutsideMeeting=runtimeMessages.some(m=>m.command==='voice'&&m.voice);
  q('.remote-toggle').click();await wait(20);r.stopClosesSocket=remote.closed===true;
 }catch(e){r.error=e.stack}
 window.done=true;document.querySelector('#out').textContent=JSON.stringify(r,null,2);
});
</script>
