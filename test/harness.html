<!doctype html>
<meta charset="utf-8" />
<title>Teste do microfone</title>
<button id="run">Rodar</button>
<pre id="out">aguardando...</pre>
<script>
  window.__vozTest = true;
  window.RTCPeerConnection = class extends EventTarget {};
  // Substitui o microfone real por um oscilador, para testar sem hardware.
  window.realTracks = [];
  const fakeContext = new AudioContext();
  const fakeVideo = document.createElement("canvas").captureStream().getVideoTracks()[0];
  navigator.mediaDevices.getUserMedia = async (constraints) => {
    const tracks = [];
    if (constraints.audio) {
      window.lastAudioConstraints = constraints.audio;
      const osc = fakeContext.createOscillator();
      const dest = fakeContext.createMediaStreamDestination();
      osc.connect(dest);
      osc.start();
      tracks.push(dest.stream.getAudioTracks()[0]);
      window.realTracks.push(tracks[0]);
    }
    if (constraints.video) tracks.push(fakeVideo);
    return new MediaStream(tracks);
  };
</script>
<script src="../src/audio-utils.js"></script>
<script>
  const SOURCE = "voz-traduzida";
  const messages = [];
  window.addEventListener("message", (e) => {
    if (e.data?.source === SOURCE && e.data.dir === "up") messages.push(e.data);
  });
</script>
<script src="../src/pcm-player.js"></script>
<script src="../src/inject.js"></script>
<script>
  const down = (m) => window.postMessage({ source: SOURCE, dir: "down", ...m }, "*");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const count = (type) => messages.filter((m) => m.type === type).length;

  // O navegador só libera o áudio depois de um clique.
  document.getElementById("run").onclick = () => run().catch((err) => {
    window.done = true;
    document.getElementById("out").textContent = "ERRO: " + err.message;
  });

  async function run() {
    const results = (window.results = {});
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    const track = stream.getAudioTracks()[0];
    results.announcesReady = messages.some((m) => m.type === "inject-ready");
    results.audioTrackReplaced = track !== window.realTracks[0];
    results.noiseSuppressionRequested = window.lastAudioConstraints.noiseSuppression === true;
    results.videoTrackKept = stream.getVideoTracks()[0] === fakeVideo;
    await wait(50);
    results.micReady = count("mic-ready") === 1;

    const original = await navigator.mediaDevices.getUserMedia({ video: true });
    await wait(50);
    results.videoOnlyUntouched = original.getAudioTracks().length === 0 && count("mic-ready") === 1;

    await fakeContext.resume();
    await wait(600);
    results.originalSendsNothing = count("audio") === 0;

    down({ type: "set-mode", mode: "translated" });
    await wait(1000);
    results.translatedSendsAudio = count("audio") > 0;
    results.micGainZero = window.__vozDebug?.micGain() === 0;

    track.enabled = false;
    await wait(500);
    const before = count("audio");
    await wait(600);
    results.mutedSendsNothing = count("audio") === before;
    results.mutedNotified = messages.some((m) => m.type === "mic-muted" && m.muted === true);
    track.enabled = true;
    await wait(400);

    down({ type: "play", data: VozAudio.int16ToBase64(new Int16Array(120000).fill(8000)) });
    await wait(50);
    results.playQueued = window.__vozDebug?.queued() > 0;
    down({ type: "flush" });
    await wait(50);
    results.flushClears = window.__vozDebug?.queued() === 0;

    down({ type: "set-mode", mode: "original" });
    await wait(50);
    results.originalRestoresMic = window.__vozDebug?.micGain() === 1;

    down({ type: "voice-filters", on: false });
    await wait(200);
    results.filtersReportsLiveChange = messages.some(
      (m) => m.type === "voice-filters-state" && m.applied === false
    );
    const second = await navigator.mediaDevices.getUserMedia({ audio: true });
    results.filtersOffOnNextCapture = window.lastAudioConstraints.noiseSuppression === false;
    results.echoCancellationStaysOn = window.lastAudioConstraints.echoCancellation === true;
    down({ type: "voice-filters", on: true });
    await wait(100);
    const secondTrack = second.getAudioTracks()[0];
    await wait(100);
    results.secondRequestKeepsFirst = window.realTracks[0].readyState === "live";
    results.firstAudioGraphAlive = window.__vozDebug?.contextStates().every((s) => s === "running");

    down({ type: "set-mode", mode: "translated" });
    await wait(600);
    track.enabled = false;
    await wait(400);
    let mark = count("audio");
    await wait(500);
    results.mutingOlderTrackBlocksSending = count("audio") === mark;
    track.enabled = true;
    await wait(300);

    secondTrack.stop();
    await wait(100);
    results.stopEndsRealTrack = window.realTracks[1].readyState === "ended";
    results.stopClosesContext = window.__vozDebug?.contextState() === "closed";
    results.noMicClosedWhileOneRemains = count("mic-closed") === 0;
    mark = count("audio");
    await wait(600);
    results.fallsBackToOlderTrack = count("audio") > mark;

    track.stop();
    await wait(100);
    results.micClosedAfterLastStop = count("mic-closed") === 1;
    down({ type: "set-mode", mode: "original" });
    await wait(50);

    // A captura remota agora é testada separadamente: não intercepta mais WebRTC.
    window.done = true;
    document.getElementById("out").textContent = JSON.stringify(results, null, 2);
  }
</script>
